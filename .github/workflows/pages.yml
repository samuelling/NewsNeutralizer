name: Analyze sites and deploy Pages

on:
  schedule:
    # Twice a day, ~6:47 AM and 6:47 PM Eastern (times are UTC). Edit to taste.
    - cron: '47 11,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: word list only, no API calls (tests fetching from GitHub)'
        type: boolean
        default: false
      only:
        description: 'Only analyze this site id from sites.json (blank = all)'
        type: string
        required: false
  push:
    branches: [main]
    paths: ['public/**', 'lib/**', 'scripts/**', 'sites.json', '.github/workflows/pages.yml']

permissions:
  contents: write   # commit results back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Analyze sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Set a repository variable NN_ANTHROPIC_MODEL=claude-haiku-5-5 to cut costs ~10x.
          NN_ANTHROPIC_MODEL: ${{ vars.NN_ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/build-pages.js --ui-only
          else
            node scripts/build-pages.js \
              ${{ inputs.dry_run && '--mock' || '' }} \
              ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          fi

      - name: Commit results
        run: |
          git config user.name "newsneutralizer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update analyses $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash origin main
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
